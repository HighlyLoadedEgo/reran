<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1c2433" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="200" font-family="Menlo, Monaco, monospace" font-size="120" font-weight="bold" fill="#e6edf3">reran</text>
  <rect x="84" y="228" width="380" height="8" fill="url(#accent)"/>

  <text x="82" y="300" font-family="Menlo, Monaco, monospace" font-size="34" fill="#8b949e">Your agent already ran that.</text>
  <text x="82" y="350" font-family="Menlo, Monaco, monospace" font-size="34" font-weight="bold" fill="#3fb950">reran remembers.</text>

  <text x="82" y="420" font-family="Menlo, Monaco, monospace" font-size="22" fill="#8b949e">memoization for AI coding agents · filesystem-validated · session-scoped</text>

  <!-- terminal -->
  <rect x="80" y="460" width="760" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="110" cy="488" r="6" fill="#f85149"/>
  <circle cx="132" cy="488" r="6" fill="#d29922"/>
  <circle cx="154" cy="488" r="6" fill="#3fb950"/>
  <text x="104" y="530" font-family="Menlo, Monaco, monospace" font-size="22" fill="#e6edf3">$ git log --stat -20</text>
  <text x="104" y="562" font-family="Menlo, Monaco, monospace" font-size="22" fill="#3fb950">reran: unchanged since turn 14 · (97 lines) · exit 0</text>

  <!-- savings chip -->
  <rect x="880" y="460" width="320" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="906" y="510" font-family="Menlo, Monaco, monospace" font-size="20" fill="#8b949e">tokens saved</text>
  <text x="906" y="556" font-family="Menlo, Monaco, monospace" font-size="40" font-weight="bold" fill="#3fb950">13,618</text>

  <!-- corner badges -->
  <text x="1200" y="80" font-family="Menlo, Monaco, monospace" font-size="22" fill="#30363d" text-anchor="end">pairs with rtk</text>
</svg>
